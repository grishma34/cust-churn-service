# Quality gate (REQ: claude.md "Commands"). Coverage threshold switches on in
# Phase 3, once src/ has meaningful code — until then pytest runs without
# --cov-fail-under so the gate is real but not vacuous.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt
            training/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src training tests scripts
          ruff format --check src training tests scripts

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
