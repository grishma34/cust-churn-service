# Quality gate (claude.md "Commands"): lint + tests + 90% coverage on src/
# (NFR-0001; threshold live since Phase 3).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt
            training/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src training tests scripts
          ruff format --check src training tests scripts

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate SAM template
        run: sam validate --lint
